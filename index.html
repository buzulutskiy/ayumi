<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d10">
  <title>Аюми</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <!-- Заставки запуска: без них айфон рисует белый лист, пока грузится
       приложение. Цвет тот же, что у фона, — перехода не видно. Размеры
       обязаны совпадать с экраном точь-в-точь, иначе картинка не берётся.
       Собираются командой: python3 tools/splash.py -->
  <link rel="apple-touch-startup-image" href="splash-1179x2556.png"
    media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="splash-1290x2796.png"
    media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="splash-1170x2532.png"
    media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="splash-1125x2436.png"
    media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="splash-828x1792.png"
    media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="splash-750x1334.png"
    media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">

  <style>
    /* ══════════ Палитра ══════════
       Одно место, где живут цвета. Всё остальное берёт их отсюда — поэтому
       новая тема это правка одного блока, а не поиск по всему файлу. */
    :root {
      color-scheme: dark;
      --bg: #0b0d10;
      --ink: #e9ecf1;
      --muted: #8892a0;
      --dim: #5c6672;
      --accent: #d8ff4a;
      --accent-2: #a8e83a;
      --green: #4ade80;
      --red: #ff6b5a;

      --glass: rgba(255, 255, 255, 0.055);
      --glass-2: rgba(255, 255, 255, 0.09);
      --glass-line: rgba(255, 255, 255, 0.09);
      --track: rgba(255, 255, 255, 0.09);
      --panel: rgba(22, 27, 34, 0.62);
      --bar: rgba(16, 19, 24, 0.74);
      --sheet: rgba(20, 24, 30, 0.92);
      --shadow: rgba(0, 0, 0, 0.35);

      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
    }
    /* Светлая тема — пример того, как заводится вторая: переопределяются
       только токены, ни одно правило ниже не меняется. */
    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #f6f4fa; --ink: #1b1826; --muted: #5f5a70; --dim: #8b869c;
      --accent: #6b8c00; --accent-2: #4f7000;
      --glass: rgba(0, 0, 0, 0.04); --glass-2: rgba(0, 0, 0, 0.07);
      --glass-line: rgba(0, 0, 0, 0.09); --track: rgba(0, 0, 0, 0.08);
      --panel: rgba(255, 255, 255, 0.7); --bar: rgba(255, 255, 255, 0.78);
      --sheet: rgba(255, 255, 255, 0.94); --shadow: rgba(0, 0, 0, 0.12);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    /* Интерфейс не выделяется — как в родном приложении. Тексты, которые
       хочется скопировать, возвращают выделение себе сами. */
    body { -webkit-user-select: none; user-select: none; }
    .pick-text, input, textarea, select { -webkit-user-select: text; user-select: text; }

    html { background: #0b0d10; height: 100%; touch-action: manipulation; }
    html, body { margin: 0; overflow-x: hidden; }
    body {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; overflow: hidden;
      font-family: ui-rounded, -apple-system, "SF Pro Rounded", system-ui, "Segoe UI", sans-serif;
      background: var(--bg); color: var(--ink);
      font-size: 16px; line-height: 1.4;
    }
    button, input, textarea, select { font: inherit; color: inherit; }
    button { border: 0; background: none; cursor: pointer; }
    h1, h2, h3, p { margin: 0; }

    /* ══════════ Скелет ══════════ */
    .app { flex: 1; display: flex; flex-direction: column; min-height: 0; }
    header {
      display: flex; align-items: center; gap: 10px;
      padding: calc(var(--safe-t) + 10px) 16px 8px;
      flex: none;
    }
    .logo { font-weight: 850; font-size: 1.15rem; display: flex; align-items: baseline; gap: 7px; }
    .logo em {
      font-style: normal;
      background: linear-gradient(120deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .logo i { font-style: normal; font-size: 0.7rem; color: var(--dim); letter-spacing: 0.18em; }
    .gear {
      margin-left: auto; width: 38px; height: 38px; border-radius: 12px;
      background: var(--glass); border: 1px solid var(--glass-line); font-size: 1rem;
    }
    /* Точка состояния синхронизации: цвет говорит, что происходит с данными */
    .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); flex: none; }
    .sync-dot.ok { background: var(--green); }
    .sync-dot.busy { background: var(--accent); animation: pulse 1s infinite; }
    .sync-dot.err { background: var(--red); }
    .sync-dot.off { background: var(--dim); }
    @keyframes pulse { 50% { opacity: 0.25; } }

    #view { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 4px 16px 18px; }

    .tabbar {
      flex: none; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr;
      padding: 8px 6px calc(var(--safe-b) + 8px);
      background: var(--bar); backdrop-filter: blur(18px);
      border-top: 1px solid var(--glass-line);
    }
    .tabbar button {
      display: grid; gap: 3px; justify-items: center;
      font-size: 0.66rem; color: var(--dim); padding: 4px 2px;
    }
    .tabbar button i { font-style: normal; font-size: 1.1rem; line-height: 1; }
    .tabbar button.on { color: var(--accent); }

    /* ══════════ Кирпичи ══════════ */
    .panel {
      background: var(--panel); border: 1px solid var(--glass-line);
      border-radius: 20px; padding: 16px; margin-bottom: 14px;
      backdrop-filter: blur(12px);
    }
    .blk-head { margin: 0 0 12px; font-size: 0.92rem; font-weight: 800; }
    .group {
      margin: 18px 0 8px; font-size: 0.68rem; font-weight: 800;
      text-transform: uppercase; letter-spacing: 0.1em; color: var(--dim);
    }
    .row {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 14px; border-radius: 16px;
      background: var(--glass); border: 1px solid var(--glass-line);
      margin-bottom: 8px; width: 100%; text-align: left;
    }
    .row i { font-style: normal; font-size: 1.15rem; flex: none; }
    .row b { font-size: 0.86rem; font-weight: 700; }
    .row em { font-style: normal; font-size: 0.72rem; color: var(--dim); display: block; margin-top: 1px; }
    .row .go { margin-left: auto; color: var(--dim); }

    .btn {
      display: block; width: 100%; padding: 13px 16px; border-radius: 15px;
      background: var(--glass-2); border: 1px solid var(--glass-line);
      font-size: 0.88rem; font-weight: 700; text-align: center;
    }
    .btn.gold { color: #131600; }
    .btn.gold {
      background: linear-gradient(120deg, var(--accent), var(--accent-2));
      color: #131600; border-color: transparent;
    }
    .btn.danger { color: var(--red); }
    .btn:disabled { opacity: 0.45; }
    .btn + .btn { margin-top: 8px; }

    .note-input {
      width: 100%; padding: 12px 13px; border-radius: 14px;
      background: var(--glass); border: 1px solid var(--glass-line);
      font-size: 16px;                        /* меньше — и айфон приближает экран */
    }
    .note-input::placeholder { color: var(--dim); }

    .empty-note { padding: 22px 14px; text-align: center; font-size: 0.78rem; color: var(--dim); }

    /* Полоса состояния: ошибка синхронизации, обновление, офлайн */
    #banner:empty { display: none; }
    .banner {
      margin: 0 0 12px; padding: 12px 14px; border-radius: 16px;
      display: flex; align-items: center; gap: 12px;
      font-size: 0.76rem; line-height: 1.35;
      background: var(--glass); border: 1px solid var(--glass-line);
    }
    .banner.warn { border-color: rgba(248, 113, 113, 0.4); }
    .banner.news { border-color: rgba(216, 255, 74, 0.4); }
    .banner > span { flex: 1; min-width: 0; }
    .banner .btn { width: auto; margin-left: auto; padding: 8px 13px; flex: none; }

    /* ══════════ Своё ══════════ */
    /* Главное число занятия: минуты бега. Крупно, потому что это
       единственное, ради чего экран открывают. */
    .big { font-size: 3.2rem; font-weight: 850; letter-spacing: -0.04em; line-height: 1; }
    .big span { font-size: 1.15rem; font-weight: 700; color: var(--muted); letter-spacing: 0; }
    .tag { display: inline-flex; align-items: center; font-size: 0.66rem; font-weight: 800;
      letter-spacing: 0.06em; text-transform: uppercase; color: #131600;
      background: var(--accent); padding: 5px 10px; border-radius: 999px; }
    .tag.cool { background: #5ac8fa; }
    .sub { color: var(--muted); font-size: 0.82rem; line-height: 1.5; }
    .sub + .sub { margin-top: 10px; }
    .hr { height: 1px; background: var(--glass-line); margin: 13px 0; }
    /* Блок «на часы»: строки ровно те, что выставляются в таймере */
    .watch { background: rgba(0,0,0,0.26); border: 1px solid var(--glass-line);
      border-radius: 14px; padding: 12px 13px; margin-top: 14px; }
    .wl { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0;
      font-size: 0.82rem; font-variant-numeric: tabular-nums; color: var(--muted); }
    .wl + .wl { border-top: 1px dashed rgba(255,255,255,0.07); }
    .wl b { color: var(--ink); font-weight: 750; text-align: right; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
    .stat { background: var(--glass); border: 1px solid var(--glass-line);
      border-radius: 16px; padding: 12px 10px; }
    .stat b { display: block; font-size: 1.32rem; font-weight: 800; letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums; }
    .stat em { font-style: normal; font-size: 0.66rem; color: var(--dim); }
    .bar { height: 6px; background: var(--track); border-radius: 3px; overflow: hidden; }
    .bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
    svg { display: block; width: 100%; height: auto; }
    /* Лента мест на маршруте */
    .stop { display: flex; gap: 12px; }
    .stop .line { width: 12px; flex: none; display: flex; flex-direction: column; align-items: center; }
    .stop .dot { width: 11px; height: 11px; border-radius: 50%; margin-top: 4px; flex: none; background: var(--track); }
    .stop.done .dot { background: var(--accent); }
    .stop.next .dot { background: transparent; border: 2px solid var(--accent); }
    .stop .rail { flex: 1; width: 2px; background: var(--track); margin: 3px 0; }
    .stop.done .rail { background: var(--accent-2); opacity: .5; }
    .stop .body { flex: 1; min-width: 0; padding-bottom: 16px; }
    .stop .body .top { display: flex; justify-content: space-between; gap: 8px; }
    .stop .body b { font-size: 0.9rem; }
    .stop .body .km { font-size: 0.76rem; color: var(--dim); font-variant-numeric: tabular-nums; flex: none; }
    /* Медали */
    .aw { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .aw > div { background: var(--glass); border: 1px solid var(--glass-line);
      border-radius: 16px; padding: 12px 8px; text-align: center; }
    .aw .ic { font-size: 1.6rem; filter: grayscale(1); opacity: .32; }
    .aw .got .ic, .aw > div.got .ic { filter: none; opacity: 1; }
    .aw > div.got { border-color: rgba(216,255,74,.35); background: rgba(216,255,74,.07); }
    .aw .t { font-size: 0.7rem; font-weight: 750; margin-top: 6px; line-height: 1.25; }
    .aw .p { font-size: 0.6rem; color: var(--dim); margin-top: 3px; font-variant-numeric: tabular-nums; }

    /* ══════════ Шторка ══════════ */
    #sheet {
      position: fixed; inset: 0; z-index: 90; display: flex; align-items: flex-end;
      background: rgba(0, 0, 0, 0.5); opacity: 0; pointer-events: none;
      transition: opacity 0.22s ease;
    }
    #sheet.show { opacity: 1; pointer-events: auto; }
    .sheet-box {
      width: 100%; max-height: 86vh; overflow-y: auto;
      padding: 16px 16px calc(var(--safe-b) + 16px);
      border-radius: 24px 24px 0 0;
      background: var(--sheet); backdrop-filter: blur(24px);
      border-top: 1px solid var(--glass-line);
      transform: translateY(14px); transition: transform 0.22s ease;
    }
    #sheet.show .sheet-box { transform: none; }
    .sheet-grab { width: 38px; height: 4px; border-radius: 2px; background: var(--track); margin: 0 auto 14px; }
    .sheet-actions { margin-top: 14px; display: grid; gap: 8px; }

    /* ══════════ Всплывающая строка ══════════ */
    #toast {
      position: fixed; left: 50%; bottom: calc(var(--safe-b) + 78px);
      transform: translate(-50%, 10px); z-index: 120;
      max-width: 82vw; padding: 10px 16px; border-radius: 14px;
      background: var(--sheet); border: 1px solid var(--glass-line);
      box-shadow: 0 10px 30px var(--shadow);
      font-size: 0.78rem; text-align: center;
      opacity: 0; pointer-events: none; transition: opacity 0.2s ease, transform 0.2s ease;
    }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }

    /* ══════════ Заставка ══════════
       Видна сразу, уходит по первой отрисовке — чтобы вместо белого листа
       был знак приложения. */
    #boot {
      position: fixed; inset: 0; z-index: 200;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
      background: var(--bg); transition: opacity 0.28s ease;
    }
    #boot.gone { opacity: 0; pointer-events: none; }
    #boot em {
      font-style: normal; font-weight: 850; font-size: 1.6rem;
      background: linear-gradient(120deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    #boot i { font-style: normal; font-size: 0.78rem; color: var(--dim); letter-spacing: 0.22em; }
    #boot span { margin-top: 14px; width: 92px; height: 3px; border-radius: 2px; background: var(--track); overflow: hidden; position: relative; }
    #boot span::after {
      content: ""; position: absolute; inset: 0; width: 40%; border-radius: 2px;
      background: linear-gradient(90deg, var(--accent-2), var(--accent));
      animation: bootRun 1.1s ease-in-out infinite;
    }
    @keyframes bootRun { 0% { left: -40%; } 100% { left: 100%; } }
    @media (prefers-reduced-motion: reduce) { #boot span::after { animation: none; left: 0; width: 100%; } }
  </style>
</head>
<body>
  <div id="boot" aria-hidden="true"><em>Аюми</em><i>歩み</i><span></span></div>

  <main class="app">
    <header>
      <div class="logo"><em>Аюми</em><i>歩み</i></div>
      <div class="sync-dot" id="syncDot"></div>
      <button class="gear" id="gearBtn" aria-label="Настройки">⚙️</button>
    </header>
    <div id="view"></div>
    <nav class="tabbar" id="tabbar"></nav>
  </main>

  <div id="sheet"><div class="sheet-box" id="sheetBox"></div></div>
  <div id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
