<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Разбег">
<meta name="theme-color" content="#0B0D10">
<title>Разбег</title>
<style>
:root{
  --bg:#0B0D10;
  --card:#14181E;
  --card2:#1B2027;
  --line:#252C35;
  --tx:#E9ECF1;
  --mut:#8892A0;
  --acc:#D8FF4A;
  --acc-dim:#7E9420;
  --blue:#5AC8FA;
  --warn:#FFB020;
  --bad:#FF6B5A;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--tx);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Inter,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
  overscroll-behavior-y:none;
}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-0.02em}
h1{font-size:28px}
h2{font-size:19px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:inherit;color:inherit}

/* header */
.top{padding:calc(env(safe-area-inset-top) + 14px) 0 10px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.top .sub{color:var(--mut);font-size:13px}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card.flat{background:transparent;border:0;padding:0}
.lbl{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);font-weight:600}

/* today hero */
.hero{position:relative;overflow:hidden;background:linear-gradient(160deg,#1C2430 0%,#14181E 60%);border:1px solid var(--line);border-radius:22px;padding:20px;margin-bottom:12px}
.hero .glow{position:absolute;right:-60px;top:-70px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(216,255,74,.18),transparent 68%);pointer-events:none}
.hero .type{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:650;letter-spacing:.04em;text-transform:uppercase;color:var(--bg);background:var(--acc);padding:5px 10px;border-radius:999px}
.hero .type.rest{background:var(--card2);color:var(--mut)}
.hero .type.blue{background:var(--blue)}
.big{font-size:56px;line-height:1;font-weight:700;letter-spacing:-0.045em;margin:14px 0 2px;font-variant-numeric:tabular-nums}
.big span{font-size:22px;font-weight:600;color:var(--mut);letter-spacing:0}
.hero .det{color:var(--mut);font-size:14px;margin-top:8px}
.hero .why{margin-top:14px;padding-top:13px;border-top:1px solid var(--line);color:var(--mut);font-size:13px}
.watch{margin-top:15px;background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:12px;padding:12px 13px}
.wl{font-size:13.5px;font-variant-numeric:tabular-nums;padding:3px 0;color:var(--tx)}
.wl+.wl{border-top:1px dashed rgba(255,255,255,.07)}

.btn{display:block;width:100%;text-align:center;background:var(--acc);color:#131600;font-weight:650;padding:15px;border-radius:14px;font-size:16px}
.btn:active{opacity:.75}
.btn.sec{background:var(--card2);color:var(--tx);border:1px solid var(--line)}
.btn.gh{background:transparent;color:var(--mut);border:1px solid var(--line)}
.btn.sm{padding:11px;font-size:14px;border-radius:11px}
.row{display:flex;gap:8px}
.row>*{flex:1}

/* stat grid */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.st{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 10px}
.st .v{font-size:22px;font-weight:680;letter-spacing:-0.03em;font-variant-numeric:tabular-nums}
.st .k{font-size:11px;color:var(--mut);margin-top:2px}

/* week strip */
.week{display:flex;gap:6px;margin-top:4px}
.day{flex:1;border-radius:12px;background:var(--card2);border:1px solid var(--line);padding:9px 4px;text-align:center;min-width:0}
.day.done{background:rgba(216,255,74,.13);border-color:var(--acc-dim)}
.day.today{border-color:var(--tx)}
.day.rest{opacity:.42}
.day .d{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.day .n{font-size:14px;font-weight:650;margin-top:3px;font-variant-numeric:tabular-nums}
.day.done .n{color:var(--acc)}

/* plan list */
.wk{border:1px solid var(--line);border-radius:14px;margin-bottom:8px;overflow:hidden;background:var(--card)}
.wk>.h{display:flex;align-items:center;gap:10px;padding:13px 14px;width:100%;text-align:left}
.wk>.h .ttl{flex:1;min-width:0}
.wk>.h .ttl b{font-weight:650}
.wk>.h .ttl small{display:block;color:var(--mut);font-size:12px}
.wk.now{border-color:var(--acc-dim);background:linear-gradient(180deg,rgba(216,255,74,.06),transparent)}
.wk .km{font-variant-numeric:tabular-nums;font-weight:650;font-size:15px}
.wk .body{border-top:1px solid var(--line);padding:4px 14px 10px;display:none}
.wk.open .body{display:block}
.ses{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line)}
.ses:last-child{border-bottom:0}
.ses .dot{width:9px;height:9px;border-radius:50%;background:var(--mut);flex:none}
.ses.easy .dot{background:#4C5A6B}.ses.long .dot{background:var(--acc)}
.ses.tempo .dot{background:var(--blue)}.ses.intervals .dot{background:var(--warn)}
.ses .t{flex:1;min-width:0;font-size:14px}
.ses .t small{display:block;color:var(--mut);font-size:12px}
.ses .k{font-variant-numeric:tabular-nums;color:var(--mut);font-size:14px}
.ses.ok .k{color:var(--acc)}
.chev{color:var(--mut);font-size:13px;transition:transform .15s}
.wk.open .chev{transform:rotate(90deg)}

/* charts */
svg{display:block;width:100%;height:auto;overflow:visible}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:10px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* awards */
.aw{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.a{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center;position:relative;overflow:hidden}
.a .ic{font-size:26px;filter:grayscale(1);opacity:.3}
.a .t{font-size:11.5px;font-weight:600;margin-top:6px;line-height:1.25}
.a .p{font-size:10px;color:var(--mut);margin-top:3px;font-variant-numeric:tabular-nums}
.a.got{background:linear-gradient(170deg,rgba(216,255,74,.13),var(--card));border-color:var(--acc-dim)}
.a.got .ic{filter:none;opacity:1}
.a.got .t{color:var(--tx)}
.bar{height:3px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--mut);border-radius:2px}

/* list of runs */
.rn{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.rn:last-child{border-bottom:0}
.rn .dt{width:46px;flex:none;text-align:center}
.rn .dt b{display:block;font-size:17px;font-weight:650;line-height:1;font-variant-numeric:tabular-nums}
.rn .dt small{font-size:10px;color:var(--mut);text-transform:uppercase}
.rn .m{flex:1;min-width:0}
.rn .m b{font-weight:650;font-variant-numeric:tabular-nums}
.rn .m small{display:block;color:var(--mut);font-size:12px}
.rn .x{color:var(--mut);padding:6px;font-size:15px}

/* tabbar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;
  background:rgba(11,13,16,.82);backdrop-filter:saturate(160%) blur(18px);-webkit-backdrop-filter:saturate(160%) blur(18px);
  border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
.tabbar .in{max-width:560px;margin:0 auto;display:flex}
.tb{flex:1;text-align:center;color:var(--mut);font-size:10.5px;font-weight:600;padding:2px 0}
.tb .i{display:block;font-size:19px;line-height:1.25;filter:grayscale(1);opacity:.55}
.tb.on{color:var(--acc)}
.tb.on .i{filter:none;opacity:1}

/* sheet */
.sheet{position:fixed;inset:0;z-index:50;display:none}
.sheet.on{display:block}
.sheet .bd{position:absolute;inset:0;background:rgba(0,0,0,.6)}
.sheet .pn{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:22px 22px 0 0;
  padding:8px 16px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;
  max-width:560px;margin:0 auto;animation:up .25s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(24px);opacity:.4}}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 14px}
.f{margin-bottom:14px}
.f label{display:block;font-size:13px;color:var(--mut);margin-bottom:6px}
.f input,.f select{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:13px 14px;font-size:16px}
.f input:focus,.f select:focus{outline:none;border-color:var(--acc-dim)}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:10px 4px;border-radius:9px;font-size:14px;color:var(--mut);font-weight:600}
.seg button.on{background:var(--acc);color:#131600}
.hint{color:var(--mut);font-size:12.5px;line-height:1.5}
.ol{color:var(--mut);font-size:13px;line-height:1.6;padding-left:20px;margin:8px 0}
.empty{text-align:center;color:var(--mut);padding:34px 16px;font-size:14px}
.tag{display:inline-block;font-size:11px;padding:3px 8px;border-radius:999px;background:var(--card2);border:1px solid var(--line);color:var(--mut)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));
  background:var(--tx);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:99;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-4px)}
</style>
</head>
<body>

<div id="app" class="wrap"></div>

<nav class="tabbar"><div class="in">
  <button class="tb" data-tab="today"><i class="i">🎯</i>Сегодня</button>
  <button class="tb" data-tab="plan"><i class="i">🗓</i>План</button>
  <button class="tb" data-tab="stats"><i class="i">📈</i>Прогресс</button>
  <button class="tb" data-tab="route"><i class="i">🗺</i>Путь</button>
  <button class="tb" data-tab="more"><i class="i">⚙️</i>Ещё</button>
</div></nav>

<div class="sheet" id="sheet"><div class="bd" onclick="closeSheet()"></div><div class="pn" id="sheetBody"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ==================== хранилище ==================== */
const KEY='razbeg.v1';
let S=load();
function load(){
  try{const r=JSON.parse(localStorage.getItem(KEY));
    if(r&&r.runs){if(!r.profile)r.profile=defaultProfile();return r}}catch(e){}
  return {profile:defaultProfile(),runs:[],tab:'today',seen:[]};
}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}

/* ==================== даты ==================== */
const DOW=['пн','вт','ср','чт','пт','сб','вс'];
const MON=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
function iso(d){const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())}
function fromISO(s){const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)}
function today(){const d=new Date();d.setHours(0,0,0,0);return d}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);x.setHours(0,0,0,0);return x}
function monday(d){const x=new Date(d);const w=(x.getDay()+6)%7;x.setDate(x.getDate()-w);x.setHours(0,0,0,0);return x}
function dow(d){return (d.getDay()+6)%7}
function daysBetween(a,b){return Math.round((b-a)/86400000)}
function fmtDate(d){return d.getDate()+' '+MON[d.getMonth()]}

/* ==================== числа ==================== */
function km(x){const v=Math.round(x*10)/10;return (v%1===0?String(v):v.toFixed(1).replace('.',','))}
function pace(minutes,dist){if(!minutes||!dist)return null;const p=minutes/dist;const m=Math.floor(p);const s=Math.round((p-m)*60);return m+':'+String(s===60?0:s).padStart(2,'0')}
function plural(n,a,b,c){const m=n%100;if(m>=11&&m<=14)return c;const k=n%10;return k===1?a:(k>=2&&k<=4?b:c)}

/* ==================== цели ==================== */
const GOALS={
  habit:{name:'Просто бегать',   tag:'регулярность без цели', weeks:26,peakMin:150,longMin:50},
  ten:  {name:'Подольше',        tag:'час бега за раз',       weeks:26,peakMin:210,longMin:70},
  half: {name:'Сильно дольше',   tag:'до двух часов',         weeks:26,peakMin:300,longMin:110},
};
/* план по умолчанию — никаких вопросов на входе */
function defaultProfile(){return {goal:'habit',days:2,base:8,skip:0,start:iso(monday(today())),created:iso(today())}}

/* ==================== маршруты ====================
   Набеганные километры откладываются по реальной карте. Каждая остановка — факт. */
const ROUTES=[
 {name:'Волга и донская степь',sub:'Волжский → Борисоглебск, 425 км',ic:'🌾',stops:[
  {km:10, c:'Волжская ГЭС',       f:'На момент запуска в 1961 году — крупнейшая гидроэлектростанция Европы. По плотине длиной больше трёх километров идёт дорога на правый берег: с неё Волга видна сразу в обе стороны.'},
  {km:25, c:'Волгоград',          f:'«Родина-мать зовёт!» на Мамаевом кургане — 85 метров вместе с мечом. Когда монумент открыли в 1967 году, это была самая высокая статуя в мире.'},
  {km:70, c:'Дубовка',            f:'В XVIII веке Дубовка была столицей волжского казачьего войска и перевалочным пунктом волго-донского пути: товары поднимали по Волге и дальше везли на Дон сухим путём.'},
  {km:105,c:'Иловля',             f:'Здесь Волга и Дон сходятся ближе всего — около 60 километров. В 1569 году турецкое войско пыталось прорыть тут канал и бросило работу. Волго-Донской канал построили только в 1952-м, южнее.'},
  {km:160,c:'Фролово',            f:'Город вырос из хутора при станции Арчеда на железной дороге Грязи — Царицын, открытой в 1871 году. Дорога связала донскую степь с центром страны.'},
  {km:225,c:'Михайловка',         f:'Слобода на реке Медведице, основана в 1762 году. Здесь работает Себряковский цементный завод — один из крупнейших в стране.'},
  {km:300,c:'Новоаннинский',      f:'Стоит на Бузулуке, притоке Хопра. Хопёр считают одной из самых чистых рек европейской части России — по нему и сейчас ходят на байдарках.'},
  {km:360,c:'Урюпинск',           f:'Неофициальная столица российской провинции. Здесь вяжут платки и паутинки из козьего пуха, а в центре города стоит памятник козе.'},
  {km:425,c:'Борисоглебск',       f:'При Петре I на Хопре работала корабельная верфь: лес сплавляли по реке, здесь строили суда для Азовских походов.'},
 ]},
 {name:'Черноземьем к Москве',sub:'Борисоглебск → Москва, 580 км',ic:'🌻',stops:[
  {km:130,c:'Тамбов',             f:'Основан в 1636 году как крепость на засечной черте — цепи валов, рвов и завалов, прикрывавшей страну от набегов из степи.'},
  {km:225,c:'Моршанск',           f:'В XIX веке — крупнейшая хлебная пристань на Цне. Отсюда зерно уходило водой на север, в Москву и Петербург.'},
  {km:295,c:'Шацк',               f:'Сторожевой городок, поставленный в 1553 году. Такие города-крепости ставили цепочкой, чтобы дым сигнального костра был виден от одного до другого.'},
  {km:425,c:'Рязань',             f:'Нынешняя Рязань — бывший Переяславль-Рязанский. Настоящая Старая Рязань стоит в шестидесяти километрах ниже по Оке: её сожгли в 1237 году, и город больше не поднялся. Валы там видны до сих пор.'},
  {km:495,c:'Луховицы',           f:'Здесь поставили памятник огурцу — «огурцу-кормильцу». Луховицкий огурец кормил окрестные сёла весь XX век и кормит до сих пор.'},
  {km:515,c:'Коломна',            f:'Из шестнадцати башен Коломенского кремля XVI века уцелело семь. А коломенскую пастилу делали из печёных яблок с белком, взбивая массу почти сутки.'},
  {km:580,c:'Москва',             f:'Отсюда считают километры по всей стране: знак «нулевой километр» лежит у Воскресенских ворот, на входе на Красную площадь.'},
 ]},
 {name:'Государева дорога',sub:'Москва → Санкт-Петербург, 635 вёрст',ic:'🛤',stops:[
  {km:20, c:'Химки',              f:'Канал имени Москвы открыли в 1937 году. После него Москву стали называть портом пяти морей.'},
  {km:65, c:'Солнечногорск',      f:'Озеро Сенеж — самое большое в Подмосковье, и оно рукотворное: появилось в 1820-х при строительстве Екатерининского канала.'},
  {km:85, c:'Клин',               f:'В клинском доме Чайковский дописал Шестую симфонию. Через год после его смерти здесь открыли первый в России мемориальный музыкальный музей.'},
  {km:130,c:'Завидово',           f:'Иваньковское водохранилище местные зовут Московским морем: больше 300 км² воды на месте волжских лугов.'},
  {km:170,c:'Тверь',              f:'В 1468 году тверской купец Афанасий Никитин ушёл отсюда в Индию — за тридцать лет до Васко да Гамы. Его записки известны как «Хождение за три моря».'},
  {km:240,c:'Торжок',             f:'Новоторжское золотное шитьё — промысел, которому больше семисот лет. Пушкин заезжал в Торжок по дороге между столицами десятки раз.'},
  {km:285,c:'Вышний Волочёк',     f:'Здесь в начале XVIII века заработала первая в России искусственная водная система: она связала Волгу с Балтикой и кормила Петербург хлебом.'},
  {km:330,c:'Бологое',            f:'Почти ровно середина Николаевской железной дороги, открытой в 1851 году. Отсюда и присказка «где-то между Ленинградом и Москвой».'},
  {km:385,c:'Валдай',             f:'Валдайские колокольчики лили с XVIII века, их звон был слышен за версту. Иверский монастырь на острове основан в 1653 году.'},
  {km:440,c:'Крестцы',            f:'Крестецкая строчка — сквозная вышивка по продёрнутой нити. Промысел живёт с 1860-х годов.'},
  {km:525,c:'Великий Новгород',   f:'В 1951 году здесь нашли первую берестяную грамоту. Сейчас их больше тысячи — это живая речь людей XI–XV веков.'},
  {km:590,c:'Чудово',             f:'Осенью 1874 года Некрасов прожил на Чудовской Луке две недели и написал здесь целый цикл стихов.'},
  {km:635,c:'Санкт-Петербург',    f:'Финиш. От Волжского до Невы — 1640 километров. Почтовый тракт между столицами считали в 635 вёрст, и последнюю его часть ты прошёл ногами.'},
 ]},
];
const STOPS=(()=>{const a=[];let off=0;
  ROUTES.forEach((r,ri)=>{r.stops.forEach(s=>a.push({...s,abs:off+s.km,ri}));off+=r.stops[r.stops.length-1].km});
  return a})();
const ROUTE_TOTAL=STOPS[STOPS.length-1].abs;

/* ==================== лестница занятий ====================
   Первая фаза строится по образцу NHS Couch to 5K: 5 минут шагом на разогрев,
   отрезки бега через ходьбу, 5 минут шагом на остывание. Отличие одно —
   добавлены две промежуточные ступени (15 и 19) перед прыжками на 20 и 25 минут
   непрерывного бега: у NHS программа рассчитана на 3 занятия в неделю, а тут их
   может быть два, и подходить к этим ступеням лучше плавнее.
   Прогресс идёт по занятиям, а не по календарю: пропустил неделю — просто
   продолжаешь с той же ступени, ничего не сгорает. */
const R_=(m)=>({t:'run',m}),W_=(m)=>({t:'walk',m}),F_=(m)=>({t:'fast',m}),J_=(m)=>({t:'jog',m});
function reps(n,r,w,tail){const a=[];for(let i=0;i<n;i++){a.push(R_(r),W_(w))}if(tail)a.push(R_(r));return a}
const LADDER=(()=>{
  const L=[],add=(n,segs)=>{for(let i=0;i<n;i++)L.push(segs)};
  add(3,reps(7,1,1.5,true));                                   // 1–3
  add(3,reps(5,1.5,2,true));                                   // 4–6
  add(3,[R_(1.5),W_(1.5),R_(3),W_(3),R_(1.5),W_(1.5),R_(3)]);  // 7–9
  add(3,[R_(3),W_(1.5),R_(5),W_(2.5),R_(3),W_(1.5),R_(5)]);    // 10–12
  add(1,[R_(5),W_(3),R_(5),W_(3),R_(5)]);                      // 13
  add(1,[R_(8),W_(5),R_(8)]);                                  // 14
  add(1,[R_(12),W_(3),R_(8)]);                                 // 15 — своя ступень
  add(1,[R_(20)]);                                             // 16
  add(1,[R_(5),W_(3),R_(8),W_(3),R_(5)]);                      // 17
  add(1,[R_(10),W_(3),R_(10)]);                                // 18
  add(1,[R_(20),W_(2),R_(5)]);                                 // 19 — своя ступень
  add(1,[R_(25)]);                                             // 20
  add(3,[R_(25)]);                                             // 21–23
  add(3,[R_(28)]);                                             // 24–26
  add(3,[R_(30)]);                                             // 27–29
  return L;
})();
const WARM=5,COOL=5,WALK_PACE=9;   // разминка, заминка и темп шага, мин/км
const NAME={run:'бегом',walk:'шагом',fast:'бодро',jog:'трусцой'};
const KOEF={run:1,fast:.85,jog:1.1};

function runMin(segs){return segs.filter(x=>x.t!=='walk').reduce((s,x)=>s+x.m,0)}
function walkMin(segs){return WARM+COOL+segs.filter(x=>x.t==='walk').reduce((s,x)=>s+x.m,0)}
function estKm(segs,pace){
  let d=(WARM+COOL)/WALK_PACE;
  for(const x of segs)d+=x.t==='walk'?x.m/WALK_PACE:x.m/(pace*KOEF[x.t]);
  return Math.round(d*10)/10;
}
/* Одинаковые подряд идущие пары сворачиваем: 8 × (1 мин бегом / 1,5 мин шагом) */
function groups(segs){
  const g=[];let i=0;
  while(i<segs.length){
    if(segs[i+1]&&segs[i].t!==segs[i+1].t){
      const A=segs[i],B=segs[i+1];let n=0;
      while(segs[i]&&segs[i+1]&&segs[i].t===A.t&&segs[i+1].t===B.t&&segs[i].m===A.m&&segs[i+1].m===B.m){n++;i+=2}
      if(n){g.push({work:A,rest:B,reps:n});continue}
    }
    g.push({work:segs[i],reps:1});i++;
  }
  return g;
}
function segsText(segs){
  return groups(segs).map(g=>g.rest
    ? (g.reps>1?`${g.reps} × (${mins(g.work.m)} ${NAME[g.work.t]} / ${mins(g.rest.m)} ${NAME[g.rest.t]})`
               :`${mins(g.work.m)} ${NAME[g.work.t]} → ${mins(g.rest.m)} ${NAME[g.rest.t]}`)
    : `${mins(g.work.m)} ${NAME[g.work.t]}`).join(' → ');
}
/* То же самое, но как это набирается на часах: работа / отдых / повторов */
function watchLines(segs){
  const out=[`Разминка · ${WARM} мин шагом`];
  for(const g of groups(segs)){
    if(g.rest)out.push(`Работа ${clock(g.work.m)} · отдых ${clock(g.rest.m)} · ${g.reps} ${plural(g.reps,'повтор','повтора','повторов')}`);
    else out.push(`Работа ${clock(g.work.m)} · без отдыха`);
  }
  out.push(`Заминка · ${COOL} мин шагом`);
  return out;
}
function clock(m){const w=Math.floor(m),s=Math.round((m-w)*60);return `${w}:${String(s).padStart(2,'0')}`}
function mins(m){return km(m)+' мин'}

/* Единая сборка занятия — и для лестницы, и для второй фазы. */
function makeSession(segs,day,pace,kind,extra){
  const rm=runMin(segs),wm=walkMin(segs);
  return Object.assign({day,segs,kind,type:kind==='intervals'?'intervals':(kind==='long'?'long':'easy'),
    runMin:Math.round(rm*10)/10,walkMin:wm,allMin:Math.round((rm+wm)*10)/10,
    dist:estKm(segs,pace),plan:segsText(segs),watch:watchLines(segs)},extra||{});
}
function ladderSession(idx,day,pace){
  const segs=LADDER[Math.min(idx,LADDER.length-1)];
  const cont=segs.filter(x=>x.t!=='walk').length===1;
  const n=segs.filter(x=>x.t!=='walk').length;
  return makeSession(segs,day,pace,cont?'long':'easy',{
    phase:'ladder',step:Math.min(idx,LADDER.length-1)+1,total:LADDER.length,
    title:cont?'Непрерывный бег':'Бег с ходьбой',
    goal:cont?`Пробежать ${mins(runMin(segs))} и ни разу не перейти на шаг.`
             :`Отбежать все отрезки целиком — их ${n}. Скорость не важна совсем.`});
}

/* ==================== движок плана ====================
   Всё считается в минутах: это то, что выставляется на часах.
   Километры — побочный результат, они нужны только для маршрута.
   Фаза 1 — лестница по занятиям. Фаза 2 — рост недельных минут бега. */
function buildPlan(){
  const P=S.profile,G=GOALS[P.goal];
  const start=monday(fromISO(P.start));
  const N=G.weeks;
  const runs=S.runs.slice().sort((a,b)=>a.date<b.date?-1:1);
  const map={1:[6],2:[2,6],3:[1,3,6],4:[1,3,5,6],5:[0,1,3,5,6],6:[0,1,2,3,5,6]}[P.days]||[2,6];
  const paceRaw=easyPace(),pace=paceRaw||8.5,paceKnown=!!paceRaw;
  const weeks=[];
  const nowWk=Math.floor(daysBetween(start,today())/7);
  const pos=(P.skip||0)+runs.filter(r=>{const d=fromISO(r.date);return d>=start&&d<=today()}).length;
  const ladderLeft=Math.max(0,LADDER.length-pos);

  let trend=0;                      // недельные минуты бега для фазы 2
  let longCap=maxRecentMin(pace);   // потолок одного занятия, минуты
  let cursor=(P.skip||0);

  for(let i=0;i<N;i++){
    const wStart=addDays(start,i*7),wEnd=addDays(wStart,6);
    const state=i<nowWk?'past':(i===nowWk?'now':'future');
    const wRuns=runs.filter(r=>{const d=fromISO(r.date);return d>=wStart&&d<=wEnd});
    const actual=Math.round(wRuns.reduce((s,r)=>s+r.dist,0)*10)/10;
    const actualMin=Math.round(wRuns.reduce((s,r)=>s+(r.min||r.dist*pace),0));

    let w;
    if(cursor<LADDER.length){
      const ses=map.map((d,k)=>ladderSession(cursor+k,d,pace));
      w={i,start:wStart,end:wEnd,phase:'ladder',deload:false,sessions:ses,
         planned:Math.round(ses.reduce((s,x)=>s+x.dist,0)*10)/10,
         plannedMin:ses.reduce((s,x)=>s+x.runMin,0),
         runs:wRuns,actual,actualMin,state,
         note:state==='past'?(wRuns.length>=ses.length?'пройдено':(wRuns.length?'частично':'пропущено')):''};
      cursor+=state==='future'?map.length:wRuns.length;
      trend=Math.max(trend,w.plannedMin);
      if(state!=='future')longCap=Math.max(longCap,...wRuns.map(r=>r.min||r.dist*pace),0);
    } else {
      const deload=(i%4===3);
      const volMin=Math.min(G.peakMin,Math.round(deload?trend*.8:trend));
      const ses=buildWeek(volMin,map,longCap,G,pace,i);
      w={i,start:wStart,end:wEnd,phase:'build',deload,sessions:ses,
         planned:Math.round(ses.reduce((s,x)=>s+x.dist,0)*10)/10,
         plannedMin:ses.reduce((s,x)=>s+x.runMin,0),runs:wRuns,actual,actualMin,state,note:''};
      const ratio=w.plannedMin>0?actualMin/w.plannedMin:0;
      if(state==='past'){
        if(ratio>=.9){trend*=1.1;w.note='выполнено — время выросло'}
        else if(ratio>=.6){w.note='почти — держим время'}
        else if(ratio>0){trend*=.9;w.note='недобор — сбавили'}
        else{trend*=.85;w.note='пропущено'}
        longCap=Math.max(longCap,...wRuns.map(r=>r.min||r.dist*pace),0);
      } else if(!deload){trend*=1.1}
      trend=Math.min(trend,G.peakMin);
      // потолок для планирования вперёд растёт вместе с длинной тренировкой
      if(state==='future')longCap=Math.max(longCap,Math.max(...ses.map(x=>x.runMin)));
    }
    w.ratio=w.phase==='ladder'
      ? (w.sessions.length?Math.min(1.2,wRuns.length/w.sessions.length):0)
      : (w.plannedMin>0?actualMin/w.plannedMin:0);
    weeks.push(w);
  }
  return {weeks,start,goal:G,nowWk,pos,pace,paceKnown,ladderLeft,map,
          phase:weeks[Math.min(nowWk,N-1)]?.phase||'build'};
}

/* Фаза 2. Одно занятие не растёт больше чем на 10% от самого длинного за месяц:
   резкий скачок одной пробежки предсказывает травмы лучше, чем недельный объём. */
function buildWeek(volMin,map,longCap,G,pace,wi){
  const share=map.length<=2?.55:(map.length===3?.42:.34);
  const cap=Math.max(20,Math.round(longCap*1.1));
  const long=map.length===1?Math.min(volMin,cap):Math.min(G.longMin,cap,Math.round(volMin*share));
  const rest=volMin-long,other=map.length-1;
  // лёгкая не должна догонять длинную, иначе длинная перестаёт быть длинной
  const easy=other>0?Math.min(Math.round(long*.75),Math.round(rest/other)):0;
  // скоростная работа — раз в две недели, когда недельное время это позволяет
  const hard=(volMin>=80&&other>=1&&wi%2===0)?1:0;
  return map.map((d,k)=>{
    if(k===map.length-1)
      return makeSession([R_(long)],d,pace,'long',{phase:'build',title:'Длинная',
        goal:`Пробежать ${mins(long)} целиком, ровно и медленно. На секундомер не смотреть.`});
    if(hard&&k===0){
      const n=Math.max(4,Math.min(10,Math.round(easy/4)));
      const segs=[];for(let j=0;j<n;j++)segs.push(F_(2),J_(2));
      return makeSession(segs,d,pace,'intervals',{phase:'build',title:'Ускорения',
        goal:'Все ускорения одинаковые: последнее не медленнее первого. Если последнее провалилось — в следующий раз делай на одно меньше.'});
    }
    return makeSession([R_(easy)],d,pace,'easy',{phase:'build',title:'Лёгкая',
      goal:`${mins(easy)} в разговорном темпе, без ускорений.`});
  }).filter(x=>x.runMin>=5);
}

/* Темп лёгкого бега берём из своих же данных, а не из таблиц. */
function easyPace(){
  const R=S.runs.filter(r=>r.min>0&&r.dist>=1).slice(-10);
  if(R.length<3)return 0;
  const p=R.map(r=>r.min/r.dist).sort((a,b)=>a-b);
  return Math.max(5,Math.min(12,p[Math.floor(p.length/2)]));
}
function maxRecentMin(pace){
  const from=addDays(today(),-30);
  const R=S.runs.filter(r=>fromISO(r.date)>=from);
  return R.length?Math.max(...R.map(r=>r.min||r.dist*pace)):0;
}

/* сопоставление пробежек с днями недели */
function matchWeek(w){
  const left=w.runs.slice();
  const out=w.sessions.map(s=>({...s,done:null}));
  // сначала точное совпадение по дню недели
  for(const s of out){
    const i=left.findIndex(r=>dow(fromISO(r.date))===s.day);
    if(i>=0){s.done=left.splice(i,1)[0]}
  }
  // остальное — по порядку
  for(const r of left){const s=out.find(x=>!x.done);if(s)s.done=r;else out.push({day:dow(fromISO(r.date)),type:'easy',title:'Внеплановая',dist:r.dist,detail:'',done:r,extra:true})}
  return out.sort((a,b)=>a.day-b.day);
}

/* ==================== статистика ==================== */
function stats(plan){
  const R=S.runs.slice().sort((a,b)=>a.date<b.date?-1:1);
  const total=R.reduce((s,r)=>s+r.dist,0);
  const longest=R.reduce((m,r)=>Math.max(m,r.dist),0);
  const byMonth={},byWeek={};
  for(const r of R){
    byMonth[r.date.slice(0,7)]=(byMonth[r.date.slice(0,7)]||0)+r.dist;
    const k=iso(monday(fromISO(r.date)));byWeek[k]=(byWeek[k]||0)+r.dist;
  }
  const weekMax=Math.max(0,...Object.values(byWeek));
  const monthMax=Math.max(0,...Object.values(byMonth));
  // серия недель, закрытых на 90%+
  let streak=0,best=0;
  for(const w of plan.weeks){
    if(w.state==='future')break;
    if(w.state==='now'&&w.ratio<.9)continue;
    if(w.ratio>=.9){streak++;best=Math.max(best,streak)}else if(w.state==='past')streak=0;
  }
  const paced=R.filter(r=>r.min>0&&r.dist>=2);
  const avgPace=(a)=>a.length?a.reduce((s,r)=>s+r.min,0)/a.reduce((s,r)=>s+r.dist,0):0;
  const p0=avgPace(paced.slice(0,5)),p1=avgPace(paced.slice(-5));
  const gain=(paced.length>=8&&p0&&p1)?(p0-p1)*60:0;
  const done=plan.weeks.filter(w=>w.state==='past'&&w.ratio>=.9).length;
  return {R,total,longest,count:R.length,byMonth,byWeek,weekMax,monthMax,streak,best,gain,
    early:R.some(r=>r.h!=null&&r.h<7),night:R.some(r=>r.h!=null&&r.h>=21),
    weeksDone:done,progWeeks:plan.nowWk,totalWeeks:plan.goal.weeks,
    curPace:p1?pace(p1,1):null};
}

/* Карточка занятия: что выставить на часах, с каким темпом и зачем. */
function heroSession(s,w,plan,mode){
  const band=plan.paceKnown
    ? `${pace(plan.pace*0.94,1)}–${pace(plan.pace*1.12,1)} /км — это твой обычный лёгкий темп по загруженным пробежкам.`
    : 'медленнее, чем кажется правильным.';
  return `<div class="hero"><div class="glow"></div>
    ${mode==='перенос'?'<span class="type">Догоняем</span>':`<span class="type ${s.kind==='intervals'?'blue':''}">${s.title}</span>`}
    <div class="big">${km(s.runMin)} <span>мин бега</span></div>
    <div class="det">${s.plan}</div>
    <div class="watch">
      <div class="lbl" style="margin-bottom:7px">На часы</div>

    <div class="why"><b style="font-weight:600;color:var(--tx)">Темп:</b> ${band} Проверка простая — на бегу можешь сказать фразу из пяти слов и не задохнуться. Не можешь — сбавь, это не ошибка.</div>
    <div class="why"><b style="font-weight:600;color:var(--tx)">Цель:</b> ${s.goal}</div>
    <div class="why">${s.phase==='ladder'
      ? `Ступень ${s.step} из ${s.total} · всего около ${km(s.allMin)} мин на ногах`
      : `Неделя ${w.i+1} из ${plan.goal.weeks}${w.deload?' · разгрузочная' :''} · план недели ${km(w.plannedMin)} мин бега, набрано ${km(w.actualMin)}`}</div>
  </div>`;
}

      <span class="type">Сделано сегодня</span>

      <div class="det">${doneToday.min?pace(doneToday.min,doneToday.dist)+' /км · '+Math.round(doneToday.min)+' мин':'Отметка вручную'}</div>
      <div class="why">${w.phase==='ladder'?`Ступень ${Math.min(plan.pos,LADDER.length)} из ${LADDER.length} пройдена.`:`Неделя ${w.i+1}: ${km(w.actualMin)} из ${km(w.plannedMin)} мин бега.`}</div></div>`;
  } else if(mine){
    hero=heroSession(mine,w,plan,'сегодня');
  } else if(left.length&&restDays<left.length){

  } else {
    const nx=M.find(s=>!s.done&&s.day>td);
    hero=`<div class="hero"><div class="glow"></div>
      <span class="type rest">Отдых</span>
      <div class="big">0 <span>мин</span></div>
      <div class="det">Сегодня не бежим. День отдыха между занятиями — часть программы, мышцы и связки перестраиваются именно в него.</div>
      <div class="why">${nx?`Следующее занятие: ${DOW[nx.day]} ${fmtDate(addDays(w.start,nx.day))} — ${mins(nx.runMin)} бега${nx.title?', '+nx.title.toLowerCase():''}`:'Неделя закрыта.'}</div></div>`;
  }

  return `
  <div class="top"><div><h1>${greet()}</h1><div class="sub">${DOW[td]}, ${fmtDate(today())} · неделя ${w.i+1}</div></div>
    <span class="tag">${plan.goal.name}</span></div>
  ${hero}
  <button class="btn" onclick="importSheet()">Загрузить пробежки из файла</button>
  <button class="btn gh sm" style="margin:8px 0 14px" onclick="addRun(${mine?mine.dist:(left[0]?left[0].dist:5)})">или отметить вручную</button>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px">
      <div class="lbl">Неделя ${w.i+1}</div>
      <div style="font-size:13px;color:var(--mut)">${w.phase==='ladder'
        ? `<b style="color:var(--tx)">${w.runs.length}</b> из ${w.sessions.length} ${plural(w.sessions.length,'занятия','занятий','занятий')}`
        : `<b style="color:var(--tx)">${km(w.actualMin)}</b> / ${km(w.plannedMin)} мин бега`}</div>
    </div>
    <div class="week">
      ${[0,1,2,3,4,5,6].map(d=>{
        const s=M.find(x=>x.day===d);
        const cls=[s?(s.done?'done':''):'rest',d===td?'today':''].join(' ');
        const val=s?(s.done?km(Math.round(s.done.min||s.done.dist*plan.pace))+'<span style="font-size:9px"> мин</span>'
                     :km(s.runMin)+'<span style="font-size:9px"> мин</span>'):'—';

    ${missed.length?`<div class="hint" style="margin-top:10px">Пропущено на этой неделе: ${missed.length}. Ничего страшного — догонять всё сразу не нужно, план сам подвинется на следующей неделе.</div>`:''}
  </div>
  ${routeStrip(st)}
  <div class="grid">
    <div class="st"><div class="v">${plan.ladderLeft>0?Math.min(plan.pos+1,LADDER.length):'—'}</div><div class="k">ступень из ${LADDER.length}</div></div>
    <div class="st"><div class="v">${st.best}</div><div class="k">недель серия</div></div>
    <div class="st"><div class="v">${st.curPace||'—'}</div><div class="k">темп /км</div></div>
  </div>`;
}
function greet(){const h=new Date().getHours();return h<5?'Ночь':h<11?'Утро':h<17?'День':h<23?'Вечер':'Ночь'}

/* ---------- ПЛАН ---------- */
function vPlan(plan,st){

    const M=matchWeek(w);

        <span class="chev">›</span>
        <span class="ttl"><b>Неделя ${w.i+1}</b><small>${fmtDate(w.start)} – ${fmtDate(w.end)}${w.deload?' · разгрузка':''}${w.note?' · '+w.note:''}</small></span>
        <span class="km" style="color:${w.state==='past'?(w.ratio>=.9?'var(--acc)':'var(--mut)'):'var(--tx)'}">${w.phase==='ladder'
          ? (w.state==='future'?`${w.sessions.length} зан.`:`${w.runs.length} / ${w.sessions.length}`)
          : (w.state==='future'?'':km(w.actualMin)+' / ')+km(w.plannedMin)+' мин'}</span>
      </button>
      <div class="body">${M.map(s=>`
        <div class="ses ${s.type} ${s.done?'ok':''}">
          <span class="dot"></span>
          <span class="t">${DOW[s.day]} · ${s.title}${s.step?` <span style="color:var(--mut);font-size:12px">ступень ${s.step}</span>`:''}<small>${s.plan||'Внеплановая пробежка'}</small></span>
          <span class="k">${s.done?'✓ '+km(Math.round(s.done.min||0))+' мин':km(s.runMin)+' мин'}</span>
        </div>`).join('')}</div>
    </div>`}).join('')}
  <div style="height:20px"></div>`;
}
/* Лестница целиком: видно и пройденное, и чем всё кончится. */
function ladderCard(plan){
  const pos=plan.pos;
  // сворачиваем одинаковые подряд идущие ступени в одну строку
  const rows=[];
  LADDER.forEach((segs,i)=>{
    const key=JSON.stringify(segs);
    const last=rows[rows.length-1];
    if(last&&last.key===key){last.to=i;return}
    rows.push({key,from:i,to:i,segs});
  });
  return `<div class="card">
    <div class="lbl">Лестница · ${LADDER.length} занятий</div>
    <div class="hint" style="margin-top:8px">По образцу NHS Couch to 5K. Идём по занятиям, а не по календарю: пропустил неделю — вернулся на ту же ступень, ничего не сгорело. Каждая ступень повторяется, пока не станет привычной.</div>
    <div style="margin-top:14px">
    ${rows.map(r=>{
      const done=pos>r.to, now=pos>=r.from&&pos<=r.to;
      const n=r.to-r.from+1;
      return `<div class="ses ${done?'ok':''}" style="align-items:flex-start;opacity:${done?.55:1}">
        <span class="dot" style="margin-top:6px;background:${done?'var(--acc-dim)':(now?'var(--acc)':'var(--line)')}"></span>
        <span class="t">${r.from+1}${n>1?'–'+(r.to+1):''} · ${km(runMin(r.segs))} мин бега${now?' <span style="color:var(--acc);font-size:12px">сейчас здесь</span>':''}
          <small>${segsText(r.segs)}</small></span>
      </div>`}).join('')}
    </div>
    <div class="hint" style="margin-top:12px">Дальше — набор объёма в километрах: длинная пробежка растёт не больше чем на 10% от самой длинной за последний месяц.</div>
  </div>`;
}
function ringCard(plan,st){
  const p=Math.min(1,plan.nowWk/plan.goal.weeks);
  const r=52,c=2*Math.PI*r;
  return `<div class="card" style="display:flex;gap:18px;align-items:center">
    <svg viewBox="0 0 130 130" style="width:104px;flex:none">
      <circle cx="65" cy="65" r="${r}" fill="none" stroke="var(--line)" stroke-width="11"/>
      <circle cx="65" cy="65" r="${r}" fill="none" stroke="var(--acc)" stroke-width="11" stroke-linecap="round"
        stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p)}" transform="rotate(-90 65 65)"/>
      <text x="65" y="62" text-anchor="middle" fill="var(--tx)" font-size="27" font-weight="700">${plan.nowWk+1}</text>
      <text x="65" y="80" text-anchor="middle" fill="var(--mut)" font-size="12">из ${plan.goal.weeks}</text>
    </svg>
    <div style="min-width:0">
      <div class="lbl">Прогресс программы</div>
      <div style="margin-top:6px;font-size:14px;color:var(--mut);line-height:1.5">
        Потолок — ${plan.goal.peakMin} мин бега в неделю, длинная до ${plan.goal.longMin} мин.<br>
        Недель закрыто по плану: <b style="color:var(--tx)">${st.weeksDone}</b>
      </div>
    </div></div>`;
}

/* ---------- ПРОГРЕСС ---------- */
function vStats(plan,st){
  const wk=plan.weeks.filter(w=>w.state!=='future').slice(-14);
  const fut=plan.weeks.filter(w=>w.state==='future').slice(0,4);
  const bars=[...wk,...fut];
  return `<div class="top"><div><h1>Прогресс</h1><div class="sub">${st.count} ${plural(st.count,'пробежка','пробежки','пробежек')} · ${km(st.total)} км</div></div></div>
  <div class="grid">
    <div class="st"><div class="v">${km(st.longest)}</div><div class="k">макс. за раз</div></div>
    <div class="st"><div class="v">${km(st.weekMax)}</div><div class="k">макс. неделя</div></div>
    <div class="st"><div class="v">${st.gain>0?'−'+Math.round(st.gain)+'с':'—'}</div><div class="k">темп /км</div></div>
  </div>
  <div class="card"><div class="lbl">Объём по неделям</div>${barChart(bars)}
    <div class="legend"><span><i style="background:var(--acc)"></i>факт</span><span><i style="background:var(--line)"></i>план</span></div>

  <div class="card"><div class="lbl">Последние пробежки</div>
    ${st.R.length?st.R.slice().reverse().slice(0,25).map(r=>{
      const d=fromISO(r.date);
      return `<div class="rn">
        <div class="dt"><b>${d.getDate()}</b><small>${MON[d.getMonth()]}</small></div>
        <div class="m"><b>${km(r.dist)} км</b><small>${DOW[dow(d)]}${r.min?' · '+pace(r.min,r.dist)+' /км · '+Math.round(r.min)+' мин':''}${r.src==='strava'?' · Strava':''}</small></div>
        <button class="x" onclick="delRun('${r.id}')">✕</button></div>`}).join('')
      :'<div class="empty">Пока пусто. Отметь пробежку или загрузи выгрузку из Strava.</div>'}
  </div><div style="height:20px"></div>`;
}
function barChart(ws){
  if(!ws.length)return '<div class="empty">Нет данных</div>';
  const W=520,H=170,pad=6,rp=30,n=ws.length;
  const max=Math.max(10,...ws.map(w=>Math.max(w.planned,w.actual)))*1.12;
  const bw=(W-pad-rp)/n;
  const y=v=>H-22-(v/max)*(H-40);
  return `<svg viewBox="0 0 ${W} ${H}" style="margin-top:10px">
    ${[0,.5,1].map(f=>`<line x1="${pad}" x2="${W-rp+2}" y1="${y(max*f)}" y2="${y(max*f)}" stroke="var(--line)" stroke-width="1"/>`).join('')}
    ${ws.map((w,i)=>{
      const x=pad+i*bw, iw=Math.max(4,bw*.56), ox=x+(bw-iw)/2;
      const ph=H-22-y(w.planned), ah=H-22-y(w.actual);
      return `<rect x="${ox}" y="${y(w.planned)}" width="${iw}" height="${Math.max(1,ph)}" rx="3" fill="var(--line)"/>
        ${w.actual>0?`<rect x="${ox}" y="${y(w.actual)}" width="${iw}" height="${Math.max(2,ah)}" rx="3" fill="${w.ratio>=.9?'var(--acc)':'var(--acc-dim)'}"/>`:''}
        ${i%2===0||n<9?`<text x="${ox+iw/2}" y="${H-6}" fill="var(--mut)" font-size="10" text-anchor="middle">${w.i+1}</text>`:''}`;
    }).join('')}
    ${[.5,1].map(f=>`<text x="${W-rp+7}" y="${y(max*f)+3}" fill="var(--mut)" font-size="10" text-anchor="start">${Math.round(max*f)}</text>`).join('')}
  </svg>`;
}
function paceChart(R){
  const P=R.filter(r=>r.min>0&&r.dist>=2).map(r=>({d:fromISO(r.date),p:r.min/r.dist,dist:r.dist}));
  if(P.length<3)return '<div class="empty">Нужно 3+ пробежки со временем</div>';
  const W=520,H=170,pad=44;
  const t0=+P[0].d,t1=Math.max(+P[P.length-1].d,t0+86400000);
  const ps=P.map(p=>p.p),lo=Math.min(...ps)-.3,hi=Math.max(...ps)+.3;
  const X=p=>pad+((+p.d-t0)/(t1-t0))*(W-pad*2);
  const Y=p=>18+((p.p-lo)/(hi-lo))*(H-46);
  // сглаженная линия по 3 точкам
  const sm=P.map((p,i)=>{const a=P.slice(Math.max(0,i-2),i+1);return{d:p.d,p:a.reduce((s,x)=>s+x.p,0)/a.length}});
  return `<svg viewBox="0 0 ${W} ${H}" style="margin-top:10px">
    ${[lo,(lo+hi)/2,hi].map(v=>`<line x1="${pad}" x2="${W-pad}" y1="${Y({p:v,d:P[0].d})}" y2="${Y({p:v,d:P[0].d})}" stroke="var(--line)"/>`).join('')}
    <polyline fill="none" stroke="var(--blue)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"
      points="${sm.map(p=>X(p)+','+Y(p)).join(' ')}"/>
    ${P.map(p=>`<circle cx="${X(p)}" cy="${Y(p)}" r="${Math.min(6,2.4+p.dist/6)}" fill="var(--bg)" stroke="var(--acc)" stroke-width="1.8"/>`).join('')}
    ${[lo,(lo+hi)/2,hi].map(v=>`<text x="${pad-4}" y="${Y({p:v,d:P[0].d})+3}" fill="var(--mut)" font-size="10" text-anchor="end">${pace(v,1)}</text>`).join('')}
    <text x="${pad}" y="${H-4}" fill="var(--mut)" font-size="10">${fmtDate(P[0].d)}</text>
    <text x="${W-pad}" y="${H-4}" fill="var(--mut)" font-size="10" text-anchor="end">${fmtDate(P[P.length-1].d)}</text>
  </svg>
  <div class="hint" style="margin-top:8px">Ниже — быстрее. Размер точки — длина пробежки.</div>`;
}

/* ---------- ПУТЬ ---------- */
function routeInfo(total){
  const passed=STOPS.filter(s=>total>=s.abs);
  const next=STOPS.find(s=>total<s.abs);
  const last=passed[passed.length-1];
  const from=last?last.abs:0;
  const p=next?(total-from)/(next.abs-from):1;
  return {passed,next,last,p:Math.max(0,Math.min(1,p))};
}
function routeStrip(st){
  const R=routeInfo(st.total);
  if(!R.next)return `<div class="card"><div class="lbl">Путь</div>
    <div style="margin-top:8px"><b>Весь маршрут пройден</b><div class="hint">${km(st.total)} км — от Москвы до Петербурга и вокруг Золотого кольца.</div></div></div>`;
  return `<button class="card" style="display:block;width:100%;text-align:left" onclick="S.tab='route';save();render()">
    <div style="display:flex;justify-content:space-between;align-items:baseline">
      <div class="lbl">Путь · ${ROUTES[R.next.ri].name}</div>
      <div style="font-size:13px;color:var(--mut)">${km(st.total)} км</div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;margin-top:10px">
      <div style="flex:1;min-width:0">
        <div style="font-weight:650">${R.next.c} — через ${km(R.next.abs-st.total)} км</div>
        <div class="bar" style="height:6px;margin-top:8px"><i style="width:${R.p*100}%;background:var(--acc)"></i></div>
      </div>
      <div style="font-size:22px">📍</div>
    </div>
    ${R.last?`<div class="hint" style="margin-top:9px">Последняя отметка: ${R.last.c}, ${km(R.last.abs)} км</div>`:
      `<div class="hint" style="margin-top:9px">Старт — Волжский. Впереди 1640 км до Невы.</div>`}
  </button>`;
}
function vRoute(plan,st){
  const R=routeInfo(st.total);
  const A=awardState(st),got=A.filter(a=>a.got).length;
  return `<div class="top"><div><h1>Путь</h1><div class="sub">${km(st.total)} из ${ROUTE_TOTAL} км · ${R.passed.length} ${plural(R.passed.length,'остановка','остановки','остановок')} позади</div></div></div>
  ${ROUTES.map((r,ri)=>{
    const stops=STOPS.filter(s=>s.ri===ri);
    const start=ri===0?0:STOPS.filter(s=>s.ri===ri-1).slice(-1)[0].abs;
    const open=!R.next||R.next.ri===ri||st.total>=stops[stops.length-1].abs;
    if(!open&&st.total<start)return `<div class="card" style="opacity:.5"><div class="lbl">Маршрут ${ri+1}</div>
      <div style="margin-top:6px"><b>${r.name}</b><div class="hint">${r.sub} · откроется на ${km(start)} км</div></div></div>`;
    return `<div class="card">
      <div style="display:flex;align-items:baseline;gap:8px"><span style="font-size:18px">${r.ic}</span>
        <div style="flex:1"><b>${r.name}</b><div class="hint">${r.sub}</div></div></div>
      <div style="margin-top:14px">
      ${stops.map((s,i)=>{
        const done=st.total>=s.abs, isNext=R.next&&R.next.abs===s.abs;
        return `<div style="display:flex;gap:12px">
          <div style="width:12px;flex:none;display:flex;flex-direction:column;align-items:center">
            <div style="width:11px;height:11px;border-radius:50%;margin-top:4px;flex:none;
              background:${done?'var(--acc)':(isNext?'transparent':'var(--line)')};
              border:${isNext?'2px solid var(--acc)':'none'}"></div>
            ${i<stops.length-1?`<div style="flex:1;width:2px;background:${done?'var(--acc-dim)':'var(--line)'};margin:3px 0"></div>`:''}
          </div>
          <div style="flex:1;min-width:0;padding-bottom:${i<stops.length-1?'16px':'0'}">
            <div style="display:flex;justify-content:space-between;gap:8px">
              <b style="color:${done||isNext?'var(--tx)':'var(--mut)'};font-weight:${done?'650':'500'}">${s.c}</b>
              <span style="font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums;flex:none">${km(s.abs)} км</span>
            </div>
            ${done?`<div class="hint" style="margin-top:5px">${s.f}</div>`:
              isNext?`<div class="hint" style="margin-top:5px;color:var(--acc)">Ещё ${km(s.abs-st.total)} км — и откроется факт об этом месте.</div>`:
              `<div class="hint" style="margin-top:5px;opacity:.45">Факт откроется по прибытии</div>`}
          </div></div>`}).join('')}
      </div></div>`}).join('')}
  <div class="card flat" style="margin:22px 0 10px"><div class="lbl">Медали · ${got} из ${A.length}</div></div>
  ${nextAwardCard(A)}
  ${vAwardGrid(A)}<div style="height:20px"></div>`;
}

/* ---------- НАГРАДЫ ---------- */
function vAwardGrid(A){
  return `<div class="aw">${A.map(a=>`
    <div class="a ${a.got?'got':''}">
      <div class="ic">${a.ic}</div>
      <div class="t">${a.t}</div>
      <div class="p">${a.got?'открыто':km(Math.min(a.cur,a.tgt))+' / '+km(a.tgt)}</div>
      ${a.got?'':`<div class="bar"><i style="width:${Math.min(100,a.cur/a.tgt*100)}%"></i></div>`}
    </div>`).join('')}</div>`;
}
function nextAwardCard(A){
  const next=A.filter(a=>!a.got).sort((a,b)=>(b.cur/b.tgt)-(a.cur/a.tgt))[0];
  if(!next)return '';
  return `<div class="card" style="background:linear-gradient(150deg,#1E2530,#14181E)">
    <div class="lbl">Ближайшая медаль</div>
    <div style="display:flex;align-items:center;gap:14px;margin-top:10px">
      <div style="font-size:34px;filter:grayscale(1);opacity:.55">${next.ic}</div>
      <div style="flex:1;min-width:0">
        <b>${next.t}</b><div style="color:var(--mut);font-size:13px">${next.d}</div>
        <div class="bar" style="height:5px"><i style="width:${Math.min(100,next.cur/next.tgt*100)}%;background:var(--acc)"></i></div>
      </div>
      <div style="font-variant-numeric:tabular-nums;color:var(--acc);font-weight:650">${Math.round(next.cur/next.tgt*100)}%</div>

}
function checkNew(st){
  const A=awardState(st).filter(a=>a.got).map(a=>a.id);
  const fresh=A.filter(id=>!S.seen.includes(id));
  S.seen=A;save();
  if(fresh.length&&S.runs.length){const a=AWARDS.find(x=>x.id===fresh[0]);toast(a.ic+' Награда: '+a.t)}
}

/* ---------- ЕЩЁ ---------- */
function vMore(plan,st){
  const P=S.profile;
  return `<div class="top"><div><h1>Ещё</h1><div class="sub">Данные и настройки</div></div></div>
  <div class="card">

/* ---------- импорт файлов ---------- */
function importSheet(){
  openSheet(`<h2>Загрузить пробежки</h2>
    <div class="hint" style="margin-top:10px">Выбирай <b>TCX</b> — по файлу на тренировку. Можно отметить сразу несколько, хоть все накопившиеся.</div>
    <input type="file" id="csvF" accept=".tcx,.gpx,.csv,.xml,text/xml,text/csv" multiple style="display:none" onchange="readFiles(this)">
    <button class="btn" style="margin-top:14px" onclick="document.getElementById('csvF').click()">Выбрать файлы</button>
    <div class="hint" style="margin-top:10px">Из файла берутся дата, дистанция и время. Велосипед, плавание и ходьба отсеиваются. Один и тот же файл можно грузить повторно — дубли не задваиваются.<br><br>Понимает также GPX и общий <b>activities.csv</b> из архива Strava.</div>
    <div style="height:14px"></div>
    <button class="btn gh sm" onclick="demo()">Заполнить примером (12 недель)</button>`);
}
function readFiles(inp){
  const fs=[...inp.files];if(!fs.length)return;
  let done=0,add=0,skip=0,bad=0;
  fs.forEach(f=>{
    const r=new FileReader();
    const fin=()=>{if(++done===fs.length)finishImport(add,skip,bad)};
    r.onload=()=>{const res=ingest(String(r.result));add+=res.add;skip+=res.skip;if(res.bad)bad++;fin()};
    r.onerror=()=>{bad++;fin()};
    r.readAsText(f,'utf-8');
  });
}
function ingest(text){
  if(!text||text.length<20)return {add:0,skip:0,bad:1};
  return /^\s*</.test(text)?parseXML(text):parseCSV(text);
}
function finishImport(add,skip,bad){
  const cal=add?calibrate():0;
  const lad=add?calibrateLadder():0;
  save();closeSheet();render();
  if(add&&syncOn())syncPush(true);
  if(add)toast(`Добавлено ${add} ${plural(add,'пробежка','пробежки','пробежек')}`
    +(lad?` · старт со ступени ${lad}`:(cal?` · план подстроен под ${km(cal)} км`:'')));
  else if(skip)toast('Всё это уже загружено');
  else toast(bad?'Файл не разобрался':'Пробежек в файле не нашлось');
}
/* общая точка добавления: дубли режутся по паре «дата + дистанция» */
function pushRun(d,h,dist,min,src){
  dist=Math.round(dist*100)/100;
  if(!(dist>0))return false;
  const key=iso(d)+'|'+Math.round(dist*10);
  if(pushRun.have===undefined||pushRun.stamp!==S.runs.length)pushRun.have=new Set(S.runs.map(r=>r.date+'|'+Math.round(r.dist*10)));
  if(pushRun.have.has(key))return false;
  pushRun.have.add(key);
  S.runs.push({id:'i'+S.runs.length+Date.now().toString(36),date:iso(d),dist,min:Math.round(min*10)/10,h,src});
  pushRun.stamp=S.runs.length;
  return true;
}

/* ---------- TCX и GPX ---------- */
function parseXML(text){
  let doc;
  try{doc=new DOMParser().parseFromString(text,'application/xml')}catch(e){return {add:0,skip:0,bad:1}}
  if(!doc||doc.getElementsByTagName('parsererror').length)return {add:0,skip:0,bad:1};
  const tag=(el,n)=>el.getElementsByTagName(n);
  const num=(el,n)=>{const x=tag(el,n)[0];return x?parseFloat(x.textContent)||0:0};
  let add=0,skip=0;

  // TCX: дистанция и время лежат в кругах
  for(const a of tag(doc,'Activity')){
    const sport=(a.getAttribute('Sport')||'')+' '+(tag(a,'Notes')[0]?.textContent||'');
    if(isNotRun(sport))continue;
    const laps=tag(a,'Lap');
    let dist=0,sec=0;
    for(const l of laps){dist+=num(l,'DistanceMeters');sec+=num(l,'TotalTimeSeconds')}
    let when=tag(a,'Id')[0]?.textContent||(laps[0]&&laps[0].getAttribute('StartTime'));
    const t=when?new Date(when):null;
    if(!t||isNaN(+t))continue;
    if(dist<=0)dist=trackLength(a,'Trackpoint');
    if(pushRun(t,t.getHours(),dist/1000,sec/60,'tcx'))add++;else skip++;
  }
  // GPX: считаем по точкам трека
  for(const tr of tag(doc,'trk')){
    const nm=(tag(tr,'name')[0]?.textContent||'')+' '+(tag(tr,'type')[0]?.textContent||'');
    if(isNotRun(nm))continue;
    const pts=tag(tr,'trkpt');
    if(!pts.length)continue;
    const times=[...pts].map(p=>tag(p,'time')[0]?.textContent).filter(Boolean);
    const t=times.length?new Date(times[0]):null;
    if(!t||isNaN(+t))continue;
    const sec=times.length>1?(new Date(times[times.length-1])-t)/1000:0;
    const dist=trackLength(tr,'trkpt');
    if(pushRun(t,t.getHours(),dist/1000,sec/60,'gpx'))add++;else skip++;
  }
  return {add,skip,bad:0};
}
function isNotRun(s){return /bik|cycl|ride|swim|велос|плаван|walk|hik/i.test(s||'')}
/* длина трека по координатам, метры */
function trackLength(root,tagName){
  const pts=root.getElementsByTagName(tagName);
  let sum=0,pa=null;
  for(const p of pts){
    let la,lo;
    if(p.hasAttribute('lat')){la=+p.getAttribute('lat');lo=+p.getAttribute('lon')}
    else{const pos=p.getElementsByTagName('Position')[0];if(!pos)continue;
      la=parseFloat(pos.getElementsByTagName('LatitudeDegrees')[0]?.textContent);
      lo=parseFloat(pos.getElementsByTagName('LongitudeDegrees')[0]?.textContent)}
    if(isNaN(la)||isNaN(lo))continue;
    if(pa)sum+=haversine(pa[0],pa[1],la,lo);
    pa=[la,lo];
  }
  return sum;
}
function haversine(a1,o1,a2,o2){
  const R=6371000,r=Math.PI/180;
  const dA=(a2-a1)*r,dO=(o2-o1)*r;
  const x=Math.sin(dA/2)**2+Math.cos(a1*r)*Math.cos(a2*r)*Math.sin(dO/2)**2;
  return 2*R*Math.asin(Math.min(1,Math.sqrt(x)));
}

function splitCSV(text){
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++} else q=false } else cur+=c }
    else { if(c==='"')q=true;
      else if(c===','){row.push(cur);cur=''}
      else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur=''}
      else if(c!=='\r')cur+=c }
  }
  if(cur||row.length){row.push(cur);rows.push(row)}
  return rows.filter(r=>r.length>1);
}
const RUMON={'янв':0,'фев':1,'мар':2,'апр':3,'мая':4,'май':4,'июн':5,'июл':6,'авг':7,'сен':8,'окт':9,'ноя':10,'дек':11};
function parseDate(s){
  s=(s||'').trim();if(!s)return null;
  let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return{d:new Date(+m[1],+m[2]-1,+m[3]),h:+(s.match(/[T ](\d{1,2}):/)?.[1]??12)};
  m=s.match(/^(\d{1,2})[.\/](\d{1,2})[.\/](\d{4})/);if(m)return{d:new Date(+m[3],+m[2]-1,+m[1]),h:+(s.match(/ (\d{1,2}):/)?.[1]??12)};
  m=s.match(/(\d{1,2})\s+([а-яё]{3})[а-яё.]*\s+(\d{4})/i);
  if(m&&RUMON[m[2].toLowerCase()]!=null)return{d:new Date(+m[3],RUMON[m[2].toLowerCase()],+m[1]),h:+(s.match(/,\s*(\d{1,2}):/)?.[1]??12)};
  const t=Date.parse(s.replace(/(\d)\s*(AM|PM)/i,'$1 $2'));
  if(!isNaN(t)){const d=new Date(t);return{d,h:d.getHours()}}
  return null;
}
function parseTime(s){
  s=(s||'').trim();if(!s)return 0;
  if(/:/.test(s)){const p=s.split(':').map(Number);return p.length===3?p[0]*60+p[1]+p[2]/60:p[0]+p[1]/60}
  const n=parseFloat(s.replace(',','.'));return isNaN(n)?0:n/60; // Strava отдаёт секунды
}
function parseCSV(text){
  const rows=splitCSV(text);if(rows.length<2)return {add:0,skip:0,bad:1};
  const H=rows[0].map(h=>h.replace(/^\ufeff/,'').trim().toLowerCase());
  const find=(...re)=>{for(const r of re){const i=H.findIndex(h=>r.test(h));if(i>=0)return i}return -1};
  const iDate=find(/^activity date$/,/дата занятия/,/^date$/,/дата/);
  const iType=find(/^activity type$/,/тип занятия/,/^type$/,/тип/);
  const iDist=find(/^distance$/,/^расстояние$/,/^дистанция$/,/distance/,/расстояние/);
  const iTime=find(/^moving time$/,/время в движении/,/^elapsed time$/,/общее время/,/^time$/);
  if(iDate<0||iDist<0)return {add:0,skip:0,bad:1};
  let add=0,skip=0;
  for(let i=1;i<rows.length;i++){
    const c=rows[i];
    const type=(iType>=0?c[iType]:'Run')||'';
    if(!/run|бег|jog|trail/i.test(type)||isNotRun(type))continue;
    const D=parseDate(c[iDate]);if(!D||isNaN(+D.d))continue;
    let dist=parseFloat(String(c[iDist]||'').replace(/\s/g,'').replace(',','.'));
    if(!dist||dist<=0)continue;
    if(dist>300)dist=dist/1000; // метры
    if(pushRun(D.d,D.h,dist,parseTime(iTime>=0?c[iTime]:''),'csv'))add++;else skip++;
  }
  return {add,skip,bad:0};
}

/* Стартовый объём подтягивается под реальные данные: средняя из недель с бегом
   за последние два месяца. Так план не приходится настраивать руками. */
function calibrate(){
  const start=monday(today()),by={};
  for(const r of S.runs){
    const w=monday(fromISO(r.date));
    const age=Math.round(daysBetween(w,start)/7);
    if(age>=0&&age<8)by[age]=(by[age]||0)+r.dist;
  }
  const v=Object.values(by).filter(x=>x>1);
  if(v.length<2)return 0;
  v.sort((a,b)=>a-b);
  const mid=v.length%2?v[(v.length-1)/2]:(v[v.length/2-1]+v[v.length/2])/2;
  const base=Math.max(6,Math.min(45,Math.round(mid*2)/2));
  const changed=Math.abs(base-S.profile.base)>=1;
  if(changed)S.profile.base=base;
  return changed?base:0;
}

/* Подсказка, с какой ступени лестницы стартовать.
   Считаем консервативно: непрерывно бежать человек может заметно меньше,
   чем длится вся его тренировка, поэтому берём 60% от медианного времени. */
function calibrateLadder(){
  const R=S.runs.filter(r=>fromISO(r.date)>=addDays(today(),-56)&&r.min>0);
  if(R.length<4)return 0;
  const m=R.map(r=>r.min).sort((a,b)=>a-b);
  const med=m[Math.floor(m.length/2)]*0.6;
  let skip=0;
  LADDER.forEach((segs,i)=>{if(runMin(segs)<=med)skip=i+1});
  if(skip<=(S.profile.skip||0))return 0;
  S.profile.skip=skip;
  return skip;
}


/* ==================== синхронизация через gist ====================
   Секрет живёт только в этом браузере, в репозитории его нет.
   Пробежки сливаются объединением по ключу «дата + дистанция»,
   так что телефон и компьютер сходятся к одному состоянию. */
const SKEY='razbeg.sync';
function syncCfg(){try{return JSON.parse(localStorage.getItem(SKEY))||{}}catch(e){return {}}}
function syncSave(c){localStorage.setItem(SKEY,JSON.stringify(c))}
function syncOn(){const c=syncCfg();return !!(c.gist&&c.token)}
async function gistCall(method,body){
  const c=syncCfg();
  const res=await fetch('https://api.github.com/gists/'+c.gist,{
    method,headers:{Authorization:'Bearer '+c.token,Accept:'application/vnd.github+json'},
    body:body?JSON.stringify(body):undefined});
  if(!res.ok)throw new Error(res.status===401?'токен не подошёл':(res.status===404?'гист не найден':'GitHub ответил '+res.status));
  return res.json();
}
function mergeRuns(a,b){
  const out=[],seen=new Set();
  for(const r of [...a,...b]){
    const k=r.date+'|'+Math.round(r.dist*10);
    if(seen.has(k))continue;
    seen.add(k);out.push(r);
  }
  return out.sort((x,y)=>x.date<y.date?-1:1);
}
async function syncPull(quiet){
  if(!syncOn())return false;
  try{
    const g=await gistCall('GET');
    const f=g.files&&g.files['razbeg.json'];
    if(!f)return false;
    const raw=f.truncated?await (await fetch(f.raw_url)).text():f.content;
    const rem=JSON.parse(raw);
    const before=S.runs.length;
    S.runs=mergeRuns(S.runs,rem.runs||[]);
    if(rem.profile&&(rem.updated||0)>(S.updated||0))S.profile=rem.profile;
    S.updated=Math.max(S.updated||0,rem.updated||0);
    save();render();
    if(!quiet)toast(S.runs.length>before?`Забрано ${S.runs.length-before} ${plural(S.runs.length-before,'пробежка','пробежки','пробежек')}`:'Уже всё на месте');
    return S.runs.length>before;
  }catch(e){if(!quiet)toast('Не забралось: '+e.message);return false}
}
async function syncPush(quiet){
  if(!syncOn())return false;
  try{
    S.updated=Date.parse(iso(today())+'T00:00:00')+S.runs.length;
    await gistCall('PATCH',{files:{'razbeg.json':{content:JSON.stringify(
      {profile:S.profile,runs:S.runs,seen:S.seen,updated:S.updated},null,1)}}});
    save();
    if(!quiet)toast('Отправлено');
    return true;
  }catch(e){if(!quiet)toast('Не отправилось: '+e.message);return false}
}
function syncSheet(){
  const c=syncCfg();
  openSheet(`<h2>Синхронизация</h2>
    <div class="hint" style="margin-top:8px">Данные лежат в твоём приватном гисте на GitHub. Телефон и компьютер видят одно и то же, а при переустановке браузера ничего не теряется.</div>
    <ol class="ol">
      <li>Создай токен: github.com → Settings → Developer settings → Personal access tokens → Tokens (classic) → Generate new token, отметить только область <b>gist</b>.</li>
      <li>Вставь его и номер гиста сюда. Токен остаётся только в этом браузере.</li>
    </ol>
    <div class="f"><label>Номер гиста</label><input type="text" id="syG" value="${c.gist||''}" placeholder="32 символа из адреса гиста"></div>
    <div class="f"><label>Токен</label><input type="password" id="syT" value="${c.token||''}" placeholder="ghp_…"></div>
    <button class="btn" onclick="syncSaveFields()">Сохранить и забрать данные</button>
    <div style="height:8px"></div>
    <div class="row">
      <button class="btn sec sm" onclick="syncPush()">Отправить</button>
      <button class="btn sec sm" onclick="syncPull()">Забрать</button>
    </div>
    ${c.gist?`<button class="btn gh sm" style="margin-top:8px" onclick="syncForget()">Отключить</button>`:''}`);
}
function syncSaveFields(){
  syncSave({gist:document.getElementById('syG').value.trim(),token:document.getElementById('syT').value.trim()});
  closeSheet();syncPull();
}
function syncForget(){localStorage.removeItem(SKEY);closeSheet();render();toast('Синхронизация отключена')}

/* ---------- json ---------- */
function exportJSON(){
  const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='razbeg-'+iso(today())+'.json';a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function importJSON(){
  const i=document.createElement('input');i.type='file';i.accept='.json';
  i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{const j=JSON.parse(r.result);if(!j.runs)throw 0;S=Object.assign({tab:'today',seen:[]},j);save();render();toast('Загружено')}catch(e){toast('Файл не подошёл')}};
    r.readAsText(f)};
  i.click();
}
function wipe(){if(confirm('Стереть план и все пробежки?')){localStorage.removeItem(KEY);S=load();render()}}

/* ---------- демо ---------- */
function demo(){
  const st=monday(addDays(today(),-11*7));
  S.profile={goal:'habit',days:2,base:10,walk:false,start:iso(st)};
  S.runs=[];let vol=14;
  for(let w=0;w<11;w++){
    const dl=(w%4===3),v=dl?vol*.78:vol;
    const days=[1,3,6],parts=[v*.3,v*.28,v*.42];
    days.forEach((d,j)=>{
      if(Math.random()<(w>7?.16:.08))return;
      const dist=Math.round(parts[j]*(.9+Math.random()*.2)*10)/10;
      const p=6.6-w*0.045+Math.random()*.35;
      const dt=addDays(st,w*7+d);
      S.runs.push({id:'d'+w+j,date:iso(dt),dist,min:Math.round(dist*p*10)/10,h:[7,19,10][j],src:'strava'});
    });
    if(!dl)vol*=1.07;
  }
  S.seen=[];save();closeSheet();render();toast('Пример загружен');
}

/* ==================== старт ==================== */
document.querySelectorAll('.tb').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;save();render()});
if(syncOn())syncPull(true);
render();
</script>
